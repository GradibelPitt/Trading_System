spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://localhost:5432/exchange_account
    username: exchange
    password: exchange
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.exchange.common.event"
        spring.json.value.default.type: com.exchange.common.event.TradeEvent

server:
  port: 8082

exchange:
  kafka:
    topics:
      trade-events: trade-events

logging:
  level:
    com.exchange: DEBUG
