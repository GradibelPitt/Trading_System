spring:
  application:
    name: market-data-service

  datasource:
    url: jdbc:postgresql://localhost:5432/exchange_marketdata
    username: exchange
    password: exchange
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: market-data-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.exchange.common.event"
        spring.json.value.default.type: com.exchange.common.event.TradeEvent

server:
  port: 8083

exchange:
  kafka:
    topics:
      trade-events: trade-events
  orderbook:
    depth-levels: 20        # how many price levels to broadcast in L2 snapshot

logging:
  level:
    com.exchange: DEBUG
